machine:
  part_code: "RB-001"
  part_name: "Rubber Big"

# PLACEHOLDER -- real values must come from whoever owns the Integra
# controller program (per CLAUDE.md's "ask, don't invent" rule). Validated
# only against the simulator (backend/services/plc_sim), not real hardware.
indexer:
  diameter_mm: 450.0 # CONFIRMED -- real indexer disc diameter (per explicit instruction, 2026-09-08)
  part_size_mm: 18.0 # CONFIRMED -- real part size (per explicit instruction, 2026-09-08)
  # PLACEHOLDER -- set to 4 per explicit instruction, 2026-09-08. The prior
  # "15% -> 16%" comment here was stale: it was computed against an earlier
  # diameter_mm=450 assumption, not the CONFIRMED diameter_mm=500 above, and
  # the value actually left in this field (0.0) didn't match either number.
  # At diameter_mm=500, part_size_mm=20, tolerance_pct=4 derives n_slots=75,
  # which divides the confirmed encoder_cpr=4800 below evenly (64/slot) --
  # see IndexerConfig.n_slots (config_loader.py) for the general reconciler:
  # it now walks n_slots down to the nearest divisor automatically instead
  # of hard-erroring, so this value is a starting point, not the only value
  # that would load -- confirm the real mechanical clearance tolerance with
  # whoever owns that requirement.
  tolerance_pct: 4 # PLACEHOLDER -- extra clearance added to part_size_mm per slot
  # n_slots is DERIVED, not set here: floor(pi * diameter_mm / (part_size_mm * (1 + tolerance_pct/100)))
  encoder_cpr: 4800 # CONFIRMED -- real encoder CPR (per instrumentation team, 2026-09-08)
  # CONFIRMED against real hardware, 2026-09-12: plc.registers.encoder_indexer_ppr
  # (40002, "Reset to 0 at Indexer Revolution") is the register that actually
  # tracks indexer-revolution position -- resets once per full indexer
  # revolution, at encoder_cpr (4800), exactly matching both its own sheet
  # label and CLAUDE.md Rule 2. StationDispatcher._tick_real() reads it for
  # slot/position math -- see its own comment for the two other registers
  # ruled out first (pulse_count: raw MOTOR-shaft count, resets at half this;
  # encoder_count: genuinely monotonic, a read-noise dip on it once fired a
  # reject ~4491 pulses late).
  # spec12 (pulse-precise reject timing) -- part_sensor is mounted mid-slot
  # by design, not at the slot boundary. PLACEHOLDER -- written here as
  # pulses_per_slot/2 (=40 at the current 80 pulses/slot) purely as an inert
  # stand-in; do NOT treat this as the real calibrated value (spec12 Step 0
  # explicitly warns against assuming exactly half), it's just a plausible
  # non-zero number until instrumentation measures the real mounting offset.
  entry_sensor_mid_offset_pulses: 40 # PLACEHOLDER -- see comment above

plc:
  ip: "192.168.7.72" # was .41 -- per instrumentation team's sheet
  port: 502
  vendor: integra
  # Single top-level "is this machine running in simulation" switch --
  # consolidates what used to be three separate places: this connection
  # target (host/port, mock Modbus server vs real PLC), the dispatcher's own
  # tick cadence (was per-station source.sim_interval_ms, duplicated
  # identically on every station -- a config-schema smell since the whole
  # ring physically shares one rotation speed), and the ring-wide BLANK-slot
  # harness (was a standalone top-level sim: block, see blank below).
  # Distinct from each camera's own sim: block (which only controls which
  # image file that camera reads) -- that one stays per-camera on purpose
  # (mixed real/sim commissioning).
  #
  # No nok field here (removed per explicit instruction 2026-09-07) -- OK/
  # NOK is never forced by config. Every non-blank slot runs real defect/
  # measurement inference against its sim image (cam2's /data/sim/cats/
  # folder, e.g., already mixes real-defect and clean photos), and that
  # real result decides. Only which slots are permanently unfed is a
  # sim-harness knob.
  sim:
    enabled: false
    host: "localhost"
    port: 5502
    tick_interval_ms: 1000 # replaces every station's old source.sim_interval_ms
    # Randomly seeds which physical slot INDICES are permanently unfed
    # (IndexerSlotTracker.seed_sim) -- raises at config-resolve time if
    # blank > n_slots (n_slots derives from indexer.* above).
    blank: 5
    # spec12 -- ring-wide (not per-station) real-hardware timing
    # corrections for pulse-precise reject firing, per explicit
    # instruction 2026-09-08. Both in milliseconds (matches how they'll
    # actually be measured -- stopwatch/scope against real hardware) and
    # converted to pulses internally using the CURRENT measured rotation
    # rate at the moment of use (StationDispatcher._ms_to_pulses), not a
    # fixed conversion baked in here. 0 is a valid default for both -- a
    # real, physically meaningful "no delay," not a sentinel for "unset."
    # Live here (not under indexer:/the reject station) so either can be
    # trial-and-error'd directly in this file with no code change needed.
    entry_sensor_response_delay_ms: 0 # optical sensor lag before it registers a part
    reject_actuator_response_delay_ms: 0 # solenoid/valve lag after reject_cmd is set
  # spec12 -- real-hardware poll cadence (part_sensor + pulse_count), only
  # used when sim.enabled above is false. NOT the same knob as
  # sim.tick_interval_ms (that's a simulated "time per slot," far too
  # coarse for real rising-edge/pulse-precise work). PLACEHOLDER -- matches
  # app/plc/poller.py's existing poll_hz=20.0 order of magnitude, not a
  # measured number.
  real_poll_interval_ms: 40.0 # PLACEHOLDER
  # Config-driven motor speed, written to the speed_setpoint register once
  # at session start (CLAUDE.md Rule 5: config-driven, never hardcoded).
  speed_setpoint_rpm: 65.0 # PLACEHOLDER
  # PLACEHOLDER -- app/plc/watchdog.py's heartbeat-staleness timeout before
  # escalating to STOP_CMD. Not tuned yet; real value once indexer/PLC
  # hardware is actually connected.
  watchdog_timeout_ms: 1000.0 # PLACEHOLDER
  # Bypassed for h/w integration (2026-09-11): the instrumentation side
  # isn't incrementing `heartbeat` (40005) yet, so the watchdog was firing
  # STOP_CMD every ~1s and stopping the motor during commissioning even
  # though the rest of the PLC link (pulse_count, part_sensor) is working
  # fine. MUST be set back to true (or removed -- true is the default)
  # before any real production run.
  watchdog_enabled: false

  # Register map per the instrumentation team's sheet. Register numbers used
  # EXACTLY as given -- literal 40001-40012, no 0-based conversion. pymodbus
  # itself wants a 0-based protocol address, so wherever this is actually
  # used in a read/write call, the 40001 offset must be subtracted at the
  # point of use -- not done here, config stores the literal number.
  registers:
    pulse_count: 40001              # PLC->PC, int -- "Encoder actual pulse"
    # CONFIRMED live, 2026-09-12: pulse_count is the raw MOTOR-shaft encoder
    # count, not the indexer's own revolution position -- resets at raw≈2400
    # (half of encoder_cpr=4800, per the 2:1 encoder-to-indexer gear ratio).
    # NOT used for slot-math/wrap-corrected position tracking.
    encoder_indexer_ppr: 40002      # PLC->PC, int -- "Reset to 0 at Indexer Revolution"
    # CONFIRMED live, 2026-09-12 -- this is the one. Resets once per full
    # indexer revolution, at encoder_cpr (4800), exactly matching its own
    # sheet label. This is the register StationDispatcher._tick_real() reads
    # for wrap-corrected slot/position tracking (after pulse_count and
    # encoder_count below were each tried and ruled out first -- see
    # dispatcher.py's module-level comment for the full history).
    encoder_count: 40003             # PLC->PC, long -- sheet says "Total pulses from machine
    # start to stop" -- CONFIRMED live, 2026-09-12, to actually be exactly
    # that: genuinely monotonic, never resets. Tried briefly as the
    # slot-tracking register instead of pulse_count; ruled out same day when
    # an ordinary 2-count read-noise dip got misread as a full revolution
    # reset and fired one reject ~4491 pulses late. Not used for slot-math.
    part_sensor: 40004                # PLC->PC, bool -- "part detection at entry"
    heartbeat: 40005                   # PLC->PC -- per-slot heartbeat tick count (1,2,3...)
    indexing_pulse: 40006               # PLC->PC, bool -- "0,1 after sending reset bit"
    heartbeat_per_slot: 40007            # PC->PLC, int -- PC-configured heartbeat cadence, in pulses
    indexing_pulse_per_slot: 40008        # PC->PLC, int -- PC-configured pulses-per-slot
    reject_cmd: 40009                      # PC->PLC, bool -- rejected-part command
    stop_cmd: 40010                         # PC->PLC, bool -- sheet labels this "halt execution"
                                             # (a pure halt bit), but the app now writes/reads it as
                                             # a combined run/stop command (1=run, 0=halt) per
                                             # explicit operator instruction (2026-09-07) -- see
                                             # app/routers/inspection.py's _write_stop_cmd(). Flag
                                             # this divergence with the instrumentation team before
                                             # it reaches real hardware.
    speed_setpoint: 40011                    # PC->PLC, int, 0-1000 scale -- see speed_setpoint_rpm
                                              # above; rpm-to-0-1000 conversion formula is UNCONFIRMED
    fault: 40012                              # BOTH sides R/W per the sheet -- violates the
                                               # project's register-ownership rule (modbus-register-design
                                               # skill: one writer only). Modeled as given, not redesigned
                                               # into FAULT_STATUS/FAULT_ACK, since that would add a
                                               # register the instrumentation team didn't give us. Flag
                                               # with them before this is used for anything safety-critical.
    # REJECT_CMD and STOP_CMD have no paired _ACK register in the sheet --
    # a real gap against CLAUDE.md Rule 4 (every _CMD needs an _ACK). Not
    # invented here; flagged for the instrumentation team.

  # error_registers:
  # - name: "Error"
  #   reg: 230 # PLACEHOLDER
  # - name: "air_pressure_low"
  #   reg: 231 # PLACEHOLDER

# actuators:
#   - name: "rejection_station_1"
#     reg: 240 # PLACEHOLDER
#     type: toggle
#   - name: "rejection_station_2"
#     reg: 241 # PLACEHOLDER
#     type: toggle

redis:
  keys:
    result: "rv_inspection_result"
    trigger: "rv_trigger_event"

# Every physical station on the ring is a stations[] entry, discriminated by
# `type`. No trigger_reg/part_id_reg anywhere: the PC self-fires off its own
# slot math (Rule 1), it never waits on a controller trigger register.
#
# `type: reject` (r1) is where the reject decision is actually evaluated
# (CLAUDE.md Rule 3) -- but it has no wired actuator yet (REJECT_CMD/40009
# stays unwired), so today it only mutates ring state
# (IndexerSlotTracker.transition_r1), nothing physical happens. When
# r1.enabled is false, NOK parts ride through untouched. `type: exit` is the
# final checkpoint: by the time a part gets here its slot status is already
# OK/NOK from s2 (or, if r1 is disabled, still unresolved and evaluated
# here as a fallback). If OK, result_write.ack_reg is a dummy ACK (confirms
# the result_aggregator increment). NOK is flagged/displayed only, no
# physical action, so no ack is expected on that path.
stations:
  - id: s1
    name: "Station 1 - Dimension Measurement"
    type: inspection
    station_offset_pulses: 267 # CONFIRMED -- measured 20deg from the presence sensor at encoder_cpr=4800 (per explicit instruction, 2026-09-11)

    cameras:
      cam1:
        ip: "192.168.6.41"
        vendor: lucid # Lucid Arena SDK -- see app/camera/driver_registry.py for supported vendors
        resolution: { x: 1920, y: 1080 }
        fps: 30
        roi: { x1: 0, y1: 0, x2: 1920, y2: 1080 }
        capture_mode: single_shot
        strobe_reg: 18 # fire-and-forget CMD, no ACK -- per-camera light, not global
        strobe_capture_delay_ms: 50 # PLACEHOLDER -- real light settle time not yet confirmed with the instrumentation team; not wired to an actual strobe write yet either (see CameraConfig.strobe_capture_delay_ms)
        sim:
          enabled: false
          image_path: "/data/sim/circles/" # black circle on white bg -- contour-measured, not detected by the stock model

    pipeline:
      # No real part-trained locator model exists yet. Stock yolo11n.pt is
      # COCO-pretrained and has no "rubber_part" class, so against these
      # plain-circle sim images it will detect nothing and measurement.py
      # falls back to whole-frame contour measurement -- same runtime
      # behavior as leaving model_path unset, until a real part-trained
      # model exists (same caveat as s2's defect model below). Own
      # model_path (not shared from a defect block -- s1 has none).
      measurement:
        # model_path/model_type commented out -- run_measurement_inference's
        # AI-locator stage is disabled in code (see measurement.py), pure
        # OpenCV caliper on the whole frame now. allowed_cameras/
        # allowed_classes stay required fields on MeasurementConfig even
        # with the model disabled: allowed_cameras is how
        # inspection_session.py decides cam1 gets a measurement pipeline at
        # all (uncommenting it out entirely breaks config load, and even if
        # it didn't, cam1 would silently get no measurement pipeline).
        # allowed_classes is otherwise unused while the model stage is off.
        # model_path: "/models/pt/osm.pt"
        # model_type: yolo
        allowed_cameras: [cam1]
        allowed_classes: ['Air_5044','Thard_5044','Rim_Cut_5044','Bar_defect_5044']
        method: caliper
        parameters:
          diameter_mm:
            # mm-per-pixel, NOT px-per-mm -- measurement.py does
            # diameter_mm = diameter_px * calibration_factor (multiply).
            # Measured against a real cam1 capture of a confirmed-OK part
            # (2026-09-09, after the camera was repositioned/lowered):
            # largest contour's caliper diameter = 443.0px, part_size_mm =
            # 18.0mm (CONFIRMED) -> 18.0/443.0 = 0.040632. NOT fully trusted
            # yet -- that capture's focus score (variance of Laplacian) was
            # 110.3 and visibly soft; re-run this calibration once focus is
            # confirmed sharp, since any blur here directly skews every
            # diameter_mm reading downstream.
            calibration_factor: 0.0402
            # upper_limit/lower_limit are tolerances (+/- from nominal_value),
            # not absolute bounds -- pass window here is nominal_value -
            # lower_limit to nominal_value + upper_limit, i.e. 17.5-18.5mm.
            # nominal_value matches the CONFIRMED real part_size_mm
            # (indexer.part_size_mm above, 2026-09-08).
            nominal_value: 18.0
            upper_limit: 0.5
            lower_limit: 0.5
            # PLACEHOLDER -- not a real roundness spec, just set above the
            # ~0.2mm noise floor measured against the clean data/sim/circles/
            # images (JPEG/antialiasing edge jitter on an otherwise-perfect
            # circle already produces ~0.19mm here) so it doesn't false-fail
            # on that noise alone. Confirm the real max allowed ovality_mm
            # for this part before trusting this gate on real captures.
            max_ovality: 0.3
            unit: mm

      result:
        pass_if: all_cameras_pass
        save_result: true
        draw_result: true

  - id: s2
    name: "Station 2 - Defect Detection"
    type: inspection
    station_offset_pulses: 1066 # PLACEHOLDER

    cameras:
      cam2:
        ip: "192.168.5.42"
        vendor: lucid
        resolution: { x: 1920, y: 1080 }
        fps: 30
        roi: { x1: 0, y1: 0, x2: 1920, y2: 1080 }
        capture_mode: single_shot
        strobe_reg: 19
        strobe_capture_delay_ms: 50 # PLACEHOLDER -- see cam1's note above
        sim:
          enabled: true
          image_path: "/home/snehal-dev/osm/osm_5044_rimcut_thard_air" # cat1-3.jpg -> NOK (real "cat" detections). noncatN_placeholder.jpg
          # -> OK -- synthetic (no internet access to source a real dog photo), just
          # needs to not trigger the stock model's "cat" class, verified it doesn't.

    pipeline:
      defect:
        model_path: "/models/pt/osm.pt" # stock COCO-pretrained yolo11n -- stand-in until a
        # real defect-trained model exists; "cat" is a real COCO class so this
        # is a working detector, not a stub. Swap for the trained defect
        # model when available.
        model_type: yolo
        conf_thresh: 0.3
        allowed_cameras: [cam2]
        detect_classes: ['Air_5044','Thard_5044','Rim_Cut_5044','Bar_defect_5044'] # everything this model outputs
        allowed_defects: ['Air_5044','Thard_5044','Rim_Cut_5044','Bar_defect_5044'] # ok/nok decided ONLY on these

      result:
        pass_if: all_cameras_pass
        save_result: true
        draw_result: true

  - id: r1
    name: "Reject Station 1"
    type: reject
    station_offset_pulses: 2400 # PLACEHOLDER -- between s2 (1080) and exit1 (1800); real value
                                 # needs the actual reject-station time-of-flight (CLAUDE.md Rule 7)
    enabled: true # false = commissioning mode, no rejection actuator wired yet -- NOK parts
                  # ride through untouched and get resolved at exit1 instead
    # spec12's reject_actuator_response_delay_ms lives under plc.sim: now
    # (ring-wide, not per-station -- see that block's comment), not here.

  - id: exit1
    name: "Exit Station - Result Check"
    type: exit
    station_offset_pulses: 3000 # PLACEHOLDER -- point where OK/NOK is evaluated
    pass_if: all_stations_pass
    result_write:
      part_id_reg: 100
      result_reg: 101
      ack_reg: 102 # dummy ack -- confirms result_aggregator increment, OK path only
