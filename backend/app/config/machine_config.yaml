machine:
  part_code: "RS-001"
  part_name: "Rubber Big"

# PLACEHOLDER -- real values must come from whoever owns the Integra
# controller program (per CLAUDE.md's "ask, don't invent" rule). Validated
# only against the simulator (services/plc_sim), not real hardware.
indexer:
  part_size_mm: 20.0 # PLACEHOLDER
  n_slots: 20 # PLACEHOLDER -- n_slots = perimeter / part_size_mm
  encoder_cpr: 3600 # PLACEHOLDER -- must be divisible by n_slots (180/slot)

plc:
  ip: "192.168.6.41"
  port: 502
  vendor: integra
  sim:
    enabled: true
    host: "localhost"
    port: 5502
  # PLACEHOLDER register addresses -- confirm real layout with the
  # controller-program owner before wiring against real hardware. Laid out
  # contiguously (pulse_count..entry_queue block) so the poll loop can read
  # them in one batched read_holding_registers call per CLAUDE.md Rule 6.
  registers:
    pulse_count: 200 # free-running, wraps every encoder_cpr counts
    heartbeat_plc: 201 # plain periodic alive signal, not slot math
    entry_queue_write_idx: 202 # PLC increments on every part-entry trigger
    entry_queue_slots_start: 203 # first of `entry_queue_size` contiguous regs
    entry_queue_size: 16 # ring buffer depth -- confirm vs. real burst rate

  # PLACEHOLDER -- names AND register numbers, confirm with the Integra
  # controller-program owner. Expected to differ per client deployment --
  # never hardcode these in the frontend (CLAUDE.md Section 6). Health Check
  # page reads these. Kept clear of the 200-218 pulse/heartbeat/entry-queue
  # block above (Rule 6's batched-read range) since these are read far less
  # often, not part of that hot-path block.
  # error_registers:
  # - name: "Error"
  #   reg: 230 # PLACEHOLDER
  # - name: "air_pressure_low"
  #   reg: 231 # PLACEHOLDER

# PLACEHOLDER -- names AND register numbers, same caveat as error_registers
# above. Device Settings page renders one row per entry.
# actuators:
#   - name: "rejection_station_1"
#     reg: 240 # PLACEHOLDER
#     type: toggle
#   - name: "rejection_station_2"
#     reg: 241 # PLACEHOLDER
#     type: toggle

zmq:
  port: 5558

redis:
  host: "localhost"
  port: 9379
  keys:
    result: "rv_inspection_result"
    trigger: "rv_trigger_event"

# Every physical station on the ring is a triggers[] entry, discriminated by
# `type`. No trigger_reg/part_id_reg anywhere: the PC self-fires off its own
# slot math (Rule 1), it never waits on a controller trigger register.
#
# This build has no reject actuator -- nothing physically leaves the ring
# early. `type: exit` is the aggregation checkpoint: at that many pulses, the
# software checks whether the part passed every inspection trigger it went
# through. If OK, result_write.ack_reg is a dummy ACK (confirms the
# result_aggregator increment). NOK is flagged/displayed only, no physical
# action, so no ack is expected on that path.
triggers:
  - id: trig1
    name: "Station 1 - Dimension Measurement"
    type: inspection
    station_offset_pulses: 540 # PLACEHOLDER -- pulses from Entry to this station

    source:
      type: simulation
      sim_interval_ms: 3000

    cameras:
      cam1:
        ip: "192.168.5.41"
        resolution: { x: 1920, y: 1080 }
        fps: 30
        roi: { x1: 0, y1: 0, x2: 1920, y2: 1080 }
        capture_mode: single_shot
        strobe_reg: 18 # fire-and-forget CMD, no ACK -- per-camera light, not global
        sim:
          enabled: true
          image_path: "/data/sim/cam1.jpg"

    pipeline:
      # own model -- no defect block on this trigger to share detections with.
      measurement:
        allowed_cameras: [cam1]
        allowed_classes: [rubber_part]
        model_path: "/models/yolo11n.pt" # PLACEHOLDER model
        model_type: yolo
        method: caliper
        parameters:
          diameter_mm:
            calibration_factor: 10.5

      result:
        pass_if: all_cameras_pass
        save_result: true
        draw_result: true

  - id: trig2
    name: "Station 2 - Defect Detection"
    type: inspection
    station_offset_pulses: 1080 # PLACEHOLDER

    source:
      type: simulation
      sim_interval_ms: 3000

    cameras:
      cam2:
        ip: "192.168.5.42"
        resolution: { x: 1920, y: 1080 }
        fps: 30
        roi: { x1: 0, y1: 0, x2: 1920, y2: 1080 }
        capture_mode: single_shot
        strobe_reg: 19
        sim:
          enabled: true
          image_path: "/data/sim/cam2.jpg"

    pipeline:
      defect:
        model_path: "/models/yolo11n.pt" # PLACEHOLDER model
        model_type: yolo
        conf_thresh: 0.50
        allowed_cameras: [cam2]
        detect_classes: [cat] # everything this model outputs
        allowed_defects: [cat] # ok/nok decided ONLY on these

      result:
        pass_if: all_cameras_pass
        save_result: true
        draw_result: true

  - id: exit1
    name: "Exit Station - Result Check"
    type: exit
    station_offset_pulses: 1800 # PLACEHOLDER -- point where OK/NOK is evaluated
    pass_if: all_triggers_pass
    result_write:
      part_id_reg: 100
      result_reg: 101
      ack_reg: 102 # dummy ack -- confirms result_aggregator increment, OK path only
