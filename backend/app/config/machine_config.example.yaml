machine:
  part_code: bolt_m8
  part_name: "rubber"

# PLACEHOLDER -- real values must come from whoever owns the Integra
# controller program (per CLAUDE.md's "ask, don't invent" rule). Validated
# only against the simulator (backend/services/plc_sim), not real hardware.
indexer:
  diameter_mm: 150.0     # PLACEHOLDER -- real indexer disc diameter
  part_size_mm: 20.0     # PLACEHOLDER
  tolerance_pct: 15.0    # PLACEHOLDER -- extra clearance added to part_size_mm per slot
  # n_slots is DERIVED, not set here: floor(pi * diameter_mm / (part_size_mm * (1 + tolerance_pct/100)))
  # -> 20 at these values. IndexerConfig.n_slots (config_loader.py) then
  # reconciles that against encoder_cpr below -- if a future edit here no
  # longer divides evenly, it walks n_slots down to the nearest value that
  # does (never up) and logs a warning, it does not fail to load.
  encoder_cpr: 3600      # PLACEHOLDER -- 180 pulses/slot at n_slots=20

plc:
  ip: "192.168.6.41"
  port: 502
  vendor: siemens
  # Written to the speed_setpoint register once at session start
  # (CLAUDE.md Rule 5: config-driven, never hardcoded).
  speed_setpoint_rpm: 30.0 # PLACEHOLDER
  # Single top-level "is this machine running in simulation" switch --
  # consolidates the mock Modbus connection target, the dispatcher's own
  # tick cadence (was per-station source.sim_interval_ms), and the
  # ring-wide OK/NOK/BLANK verdict harness (was a standalone top-level
  # sim: block) into one place. See machine_config.yaml for the fuller
  # comment on why.
  sim:
    enabled: true
    host: "localhost"
    port: 5502
    tick_interval_ms: 3000 # replaces every station's old source.sim_interval_ms
  # PLACEHOLDER register addresses -- confirm real layout with the
  # controller-program owner before wiring against real hardware. Every
  # field below is required by RegisterMapConfig (config_loader.py); no
  # subset of these is optional, even though not all are wired into the
  # poller/dispatcher yet (see machine_config.yaml's fuller per-register
  # comments for what's actually consumed today).
  registers:
    pulse_count: 300              # PLC->PC, int -- free-running, wraps every encoder_cpr counts
    encoder_indexer_ppr: 301      # PLC->PC, int -- resets to 0 at indexer revolution
    encoder_count: 302            # PLC->PC, long -- total pulses since machine start
    part_sensor: 303              # PLC->PC, bool -- part detection at entry
    heartbeat: 304                # PLC->PC -- per-slot heartbeat tick count
    indexing_pulse: 305           # PLC->PC, bool
    heartbeat_per_slot: 306       # PC->PLC, int -- PC-configured heartbeat cadence
    indexing_pulse_per_slot: 307  # PC->PLC, int -- PC-configured pulses-per-slot
    reject_cmd: 308               # PC->PLC, bool
    stop_cmd: 309                 # PC->PLC, bool -- combined run/stop (1=run, 0=halt)
    speed_setpoint: 310           # PC->PLC, int -- rpm-to-scale conversion is PLACEHOLDER
    fault: 311                    # BOTH sides -- confirm register-ownership with the
                                   # controller-program owner before real use

  # PLACEHOLDER -- names AND register numbers, confirm with the Integra
  # controller-program owner. Expected to differ per client deployment.
  error_registers:
    - name: "e_stop"
      reg: 320 # PLACEHOLDER
    - name: "air_pressure_low"
      reg: 321 # PLACEHOLDER

# PLACEHOLDER -- names AND register numbers, same caveat as error_registers
# above. Device Settings page renders one row per entry.
actuators:
  - name: "rejection_station_1"
    reg: 330 # PLACEHOLDER
    type: toggle
  - name: "rejection_station_2"
    reg: 331 # PLACEHOLDER
    type: toggle

# Every physical station on the ring -- inspection, reject, AND exit alike --
# is a stations[] entry, discriminated by `type`. No trigger_reg/part_id_reg
# anywhere: the PC self-fires off its own slot math (Rule 1), it never waits
# on a controller trigger register. Exactly one type: exit entry is required
# (ResolvedMachineConfig.exactly_one_exit_station); at most one type: reject
# entry, and if present it must sit strictly before exit in ring order
# (station_offset_pulses), per CLAUDE.md Rule 3
# (ResolvedMachineConfig.reject_before_exit).
stations:

  - id: s1
    name: "Station 1 - Surface + Dimension"
    type: inspection
    station_offset_pulses: 540   # PLACEHOLDER -- pulses from Entry to this station

    cameras:
      cam1:
        ip: "192.168.5.41"
        vendor: lucid   # Lucid Arena SDK -- see app/camera/driver_registry.py for supported vendors
        resolution: { x: 1920, y: 1080 }
        fps: 30
        roi: { x1: 0, y1: 0, x2: 1920, y2: 1080 }
        capture_mode: single_shot
        strobe_reg: 18   # fire-and-forget CMD, no ACK -- per-camera light, not global
        strobe_capture_delay_ms: 50 # PLACEHOLDER -- real light settle time not yet confirmed; not wired to an actual strobe write yet either
        sim:
          enabled: true
          image_path: "/data/sim/cam1.jpg"

      cam2:
        ip: "192.168.5.42"
        vendor: lucid
        resolution: { x: 1920, y: 1080 }
        fps: 30
        roi: { x1: 0, y1: 0, x2: 1920, y2: 1080 }
        capture_mode: single_shot
        strobe_reg: 19
        strobe_capture_delay_ms: 50 # PLACEHOLDER -- see cam1's note above
        sim:
          enabled: true
          image_path: "/data/sim/cam2.jpg"

    pipeline:
      # single model, one inference call — detects locator class(es) + defect class(es) together
      defect:
        model_path: "/models/defect_v1.pt"
        model_type: yolo
        conf_thresh: 0.50
        allowed_cameras: [cam1, cam2]
        detect_classes: [bolt, rust, crack, scratch] # everything this model outputs
        allowed_defects: [rust, crack, scratch] # ok/nok decided ONLY on these

      # no model_path -> reuses defect's raw detections, just filters allowed_classes.
      # allowed_cameras ∩ defect.allowed_cameras = {cam1} -> CMD, serial, one inference
      # pass covers defect+measurement on cam1. cam2 is defect-only -> its own parallel
      # pass. This intersection IS the serial/parallel wiring between the two blocks.
      measurement:
        allowed_cameras: [cam1] # cam1 also in defect -> CMD (serial, same camera)
        allowed_classes: [bolt] # pull this class out of defect's detections
        method: caliper
        parameters:
          diameter_mm:
            calibration_factor: 10.5
          length_mm:
            calibration_factor: 10.2

      result:
        pass_if: all_cameras_pass
        save_result: true
        draw_result: true

  - id: s2
    name: "Station 2 - Thread + Diameter Check"
    type: inspection
    station_offset_pulses: 1080   # PLACEHOLDER

    # This station used to sketch source: {type: plc} -- one station
    # real-PLC-driven while s1 stayed simulation-timer-driven. Per-station
    # firing-mode mixing is no longer expressible: firing mode is now
    # machine-wide via plc.sim.enabled (see top of file). A deliberate
    # scope reduction from "exactly ONE place governs simulation," not an
    # oversight.
    cameras:
      cam5:
        ip: "192.168.5.45"
        vendor: lucid
        resolution: { x: 1920, y: 1080 }
        fps: 30
        roi: { x1: 0, y1: 0, x2: 1920, y2: 1080 }
        capture_mode: single_shot
        strobe_reg: 21
        strobe_capture_delay_ms: 50 # PLACEHOLDER -- see s1/cam1's note above
        sim:
          enabled: true
          image_path: "/data/sim/cam5.jpg"

      cam6:
        ip: "192.168.5.46"
        vendor: lucid
        resolution: { x: 1920, y: 1080 }
        fps: 30
        roi: { x1: 0, y1: 0, x2: 1920, y2: 1080 }
        capture_mode: single_shot
        strobe_reg: 22
        strobe_capture_delay_ms: 50 # PLACEHOLDER -- see s1/cam1's note above
        sim:
          enabled: true
          video_path: "/data/sim/cam6.mp4"

    pipeline:
      defect:
        model_path: "/models/defect_v2.pt"
        model_type: yolo
        conf_thresh: 0.55
        allowed_cameras: [cam6]
        detect_classes: [bolt, dent, rust]
        allowed_defects: [dent, rust]

      # different model than defect -> needs its own inference call. allowed_cameras
      # {cam5} doesn't intersect defect's {cam6} -> parallel, not CMD -- confirmed by
      # measurement having its own explicit model_path too.
      measurement:
        allowed_cameras: [cam5]
        allowed_classes: [bolt]
        model_path: "/models/bolt_locate.pt" # explicit -> separate call, cam5 isn't in defect anyway
        model_type: yolo
        method: caliper
        parameters:
          diameter_mm:
            calibration_factor: 12.0
          head_dia_mm:
            calibration_factor: 11.8

      result:
        pass_if: all_cameras_pass
        save_result: true
        draw_result: true

  - id: r1
    name: "Reject Station 1"
    type: reject
    station_offset_pulses: 1440   # PLACEHOLDER -- between s2 (1080) and exit1 (1800); real
                                   # value needs the actual reject-station time-of-flight
                                   # (CLAUDE.md Rule 7). Must be strictly before exit1's
                                   # station_offset_pulses (CLAUDE.md Rule 3).
    enabled: true # false = commissioning mode, no rejection actuator wired yet -- NOK parts
                  # ride through untouched and get resolved at exit1 instead

  - id: exit1
    name: "Exit Station - Result Check"
    type: exit
    station_offset_pulses: 1800   # PLACEHOLDER -- point where OK/NOK is evaluated if r1
                                   # is disabled, or re-confirmed if r1 already resolved it
    pass_if: all_stations_pass
    # OK-path confirmation: the machine has a part-presence sensor at the OK
    # bin too, so ack_reg here is a real physical ACK ("this part landed in
    # the OK bin"), not just a log write. Only fires on the accept path --
    # the reject path (r1 above) has no wired actuator/ACK yet.
    result_write:
      part_id_reg: 100
      result_reg: 101
      ack_reg: 102
